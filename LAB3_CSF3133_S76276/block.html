<!--1.section example of block elements-->
<h1>Block Elements</h1>
<div>THis is a block element</div>
<p>This is a paragraph (block element)</p>

    <li>List item 1</li>
    <li>List item 2</li>
</ul>

<!--2.inline elements-->
<h2>Inline Elements</h2>
<span>This is an inline element</span><br>
<a href="#"> This is a link (inline element)</a><br>
<strong>This is bold text (inline element)</strong>
