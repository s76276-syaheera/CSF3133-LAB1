<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width,initial-scale=1.0">
        <title>Inline element</title>
    </head>
    <body>
        <h1> Contoh penggunaan Entiti HTML</h1>
        <p>
            <!--Entiti menggunakan nama-->
            Tag html terdiri daripada simbol &lt; dan &gt;
        </p>
        <hr>
        <!--Entiti menggunakan nombor-->
        Website ini adalah hakmilik NURSYAHEERA &#169;
        </hr>
        <hr>
        <!--Entiti mewakili wang euro-->
        Product ini berharga 20&euro;
        </hr>
        <hr>
        <!--Entiti mewakili wang pound-->
        Product ini berharga &pound;40
        </hr>
        <hr>
        <!--Entiti menandakan trademark-->
        &reg; Nike

    </body>
</html>
