<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width,initial-scale=1.0">
        <title>div</title>
        <style>
            #header{
                background-color:aqua;
                height:80px;
                text-align:center;
                padding-top:20px
            }

            #nav{
                background-color:orange;
                height:40px;
                text-align:center;
                padding-top:10px
            }

            #content{
                background-color:lightgrey;
                width: 60%;
                float: left;
                height:250px;
                padding: 10px;
            }

            #sidebar{
                background-color:pink;
                width: 35%;
                float: right;
                height:250px;
                padding: 10px;
            }

            #footer{
                background-color:red;
                text-align:center;
                height:60px;
                padding-top: 20px;
                clear:both;
            }
        </style>
    </head>
    <body>
        <!--inside <body>, use <div> elements to separate the webpage into sections-->
            <div id="header">Header Section</div>
            <div id="nav">Navigation Bar</div>
            <div id="content">Main Content Area</div>
            <div id="sidebar">Sidebar Content</div>
            <div id="footer">Footer Section</div>
    </body>
</html>
