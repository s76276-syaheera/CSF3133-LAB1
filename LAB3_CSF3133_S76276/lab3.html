<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page - Interactive Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .container {
            border: 2px solid black;
            background-color: white;
            padding: 20px;
            width: 50%;
            margin: 0 auto;
            border-radius: 10px;
        }

        .calculator {
            background-color: #b2ebf2; /* light turquoise */
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .contact {
            background-color: #d1c4e9; /* soft lavender */
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, output {
            margin-top: 5px;
            padding: 5px;
        }

        .submit {
            margin-top: 15px;
            padding: 8px 20px;
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">

        <h1>Contact Page</h1>

        <!-- Inline Calculator Section -->
        <div class="calculator">
            <h3>Inline Calculator</h3>
            <label for="num1">Number 1:</label>
            <input type="number" id="num1">

            <p> + </p>

            <label for="num2">Number 2:</label>
            <input type="number" id="num2">

            <p>Sum:</p>
            <output id="sum">0</output>
        </div>

        <!-- Contact Form Section -->
        <div class="contact">
            <h3>Contact Us</h3>

            <label for="email">Email:</label>
            <input type="email" id="email">

            <label for="date">Conatct Date :</label>
            <input type="date" id="date">

            <label for="satisfaction">Satisfaction Level (0–10):</label>
            <input type="range" id="satisfaction" min="0" max="10">

            <br>
            <input type="submit" value="Hantar" class="submit">
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2025
        </footer>
    </div>
</body>
</html>
