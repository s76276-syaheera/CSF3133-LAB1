<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <form>
        <div class="mb-3">
            <label for="ValidationExample" class="form-label">Username</label>
            <input type="text" class="form-control is-valid" id="validationExample" value="Correct Input">
            <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
            <label for="validationExampleInvalid" class="form-label">Password</label>
            <input type="password" class="form-control is-invalid" id="validationExampleInvalid" value="Incorrect Input">
            <div class="invalid-feedback">Please choose a stronger password.</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        </form>
</body>
</html>
