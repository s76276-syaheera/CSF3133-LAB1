<!DOCTYPE html>
<html>

        <style>
            #customers {
                font-family: Arial, Helvetica, sans-serif;
                border-collapse: collapse;
                width: 100%;
            }

            #customers td, #customer th {
                border: 1px solid #ddd;
                padding: 8px;
            }

            #customers tr :nth-child(even){
                background-color: #d97e7e;
            }

            #customers tr :hover {
                background-color: #faf79f;
            }

            #customers th {
                padding-top: 12px;
                text-transform: uppercase;
                padding-bottom: 12px;
                text-align: center;
                background-color: #08d38c;
                color: white;

            }
        </style>
    </head>
    <body>
